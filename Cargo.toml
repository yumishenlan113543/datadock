[package]
name = "datadock"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["yumishenlan113543 <yumishenlan@outlook.com>"]
description = "A small command-line backup tool that copies source directories to destination directories."
license = "MIT"
repository = "https://github.com/yumishenlan113543/datadock"
readme = "README.md"
keywords = ["backup", "cli", "files", "copy"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
env_logger = "0.11.11"
ignore = "0.4.33"
indicatif = "0.18.6"
log = "0.4.34"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
terminal_size = "0.4.4"
toml = "1.1.8"
