name: Build

on:
  workflow_dispatch:
    inputs:
      build-mode:
        description: "Build mode (debug binaries include symbols and are much slower)"
        required: true
        type: choice
        options:
          - release
          - debug
        default: release

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ inputs.build-mode }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep macOS binaries usable on older systems.
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  test:
    name: CI tests
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - platform: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - platform: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - platform: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ inputs.build-mode }}

      - name: Build
        run: cargo build --locked --target ${{ matrix.target }} ${{ inputs.build-mode == 'release' && '--release' || '' }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/${{ inputs.build-mode }}/datadock${{ matrix.ext }}" \
             "dist/datadock-${{ matrix.platform }}${{ matrix.ext }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: datadock-${{ matrix.platform }}-${{ inputs.build-mode }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
